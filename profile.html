<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>KarmaFlix • Profil</title><link rel="stylesheet" href="css/style.css" /></head>
<body data-page="profile">
<div data-kf-header></div>
<main class="main-shell section-wrap" style="max-width:760px">
  <h1>Profil utilisateur</h1>
  <div style="display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:center;background:#0e0e14;border:1px solid var(--border);padding:18px;border-radius:14px">
    <img src="https://api.dicebear.com/9.x/thumbs/svg?seed=karma" alt="avatar" style="width:90px;height:90px;border-radius:50%;border:1px solid var(--border)" />
    <div>
      <h2 id="pName" style="margin:0"></h2>
      <p id="pEmail" class="muted"></p>
      <p class="muted">Préférences : autoplay activé • langue FR • notifications discrètes.</p>
      <button class="btn btn-secondary" id="logoutBtn">Déconnexion</button>
    </div>
  </div>
</main>
<div data-kf-footer></div>
<script src="js/data.js"></script><script src="js/ui.js"></script><script src="js/app.js"></script>
</body></html>
