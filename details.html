<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>KarmaFlix • Détails</title><link rel="stylesheet" href="css/style.css" /></head>
<body data-page="details">
<div data-kf-header></div>
<main class="main-shell">
  <section class="hero" id="detailsHero">
    <div class="hero-content">
      <h1 id="dTitle"></h1>
      <p id="dTag" class="muted"></p>
      <p id="dMeta" class="muted"></p>
      <p id="dDesc"></p>
      <div class="btn-row"><button class="btn btn-primary">Regarder</button><button class="btn btn-secondary" id="detailsAdd"></button><button class="btn btn-secondary">Partager</button></div>
    </div>
  </section>
  <section class="section-wrap" style="display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:20px;align-items:start">
    <img id="dPoster" alt="poster" style="width:100%;border-radius:12px;border:1px solid var(--border)" />
    <div>
      <h2>Titres similaires</h2>
      <div class="row-scroll" id="similarRow"></div>
    </div>
  </section>
</main>
<div data-kf-footer></div>
<script src="js/data.js"></script><script src="js/ui.js"></script><script src="js/app.js"></script>
</body></html>
